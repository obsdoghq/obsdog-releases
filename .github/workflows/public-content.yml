name: Check public content

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/check_public_content.py
