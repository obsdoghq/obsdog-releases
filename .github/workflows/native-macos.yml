name: Verify macOS distribution

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact distribution tag to verify
        required: true
        type: string
      published:
        description: Also verify anonymous installation and retained-data update
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  fetch-draft:
    if: ${{ !inputs.published && github.event_name == 'workflow_dispatch' && github.repository == 'obsdoghq/obsdog-releases' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # GitHub hides drafts from read-only tokens. This job only fetches the
      # exact own-repository draft; it checks out/runs no repository or binary code.
      contents: write
    steps:
      - name: Fetch the exact draft without executing its payload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease \
            | jq -e --arg version "$RELEASE_VERSION" \
              '.tagName == $version and .isDraft == true and .isPrerelease == false'
          mkdir candidate
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir candidate
          (cd candidate && sha256sum -c checksums.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-distribution
          path: candidate/*
          if-no-files-found: error
          retention-days: 1

  native:
    needs: fetch-draft
    if: ${{ always() && (needs.fetch-draft.result == 'success' || (inputs.published && needs.fetch-draft.result == 'skipped')) }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ !inputs.published }}
        with:
          name: macos-distribution
          path: candidate
      - name: Fetch the published distribution
        if: inputs.published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease \
            | jq -e --arg version "$RELEASE_VERSION" \
              '.tagName == $version and .isPrerelease == false and .isDraft == false'
          mkdir candidate
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir candidate
      - name: Verify and execute with read-only repository permissions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)/$(uname -m)" == Darwin/arm64 ]]
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          unset GH_TOKEN GITHUB_TOKEN OBSDOG_GITHUB_TOKEN
          (cd candidate && shasum -a 256 -c checksums.txt)
          test "$(tar -tzf "candidate/obsdog_${RELEASE_VERSION}_darwin_arm64.tar.gz")" = obsdog
          tar -C candidate -xzf "candidate/obsdog_${RELEASE_VERSION}_darwin_arm64.tar.gz"
          test "$(tar -tzf "candidate/obsdog-migrate_schema11_to12_${RELEASE_VERSION}_darwin_arm64.tar.gz")" = obsdog-migrate
          tar -C candidate -xzf "candidate/obsdog-migrate_schema11_to12_${RELEASE_VERSION}_darwin_arm64.tar.gz"
          unset GH_TOKEN GITHUB_TOKEN OBSDOG_GITHUB_TOKEN
          candidate/obsdog-migrate --version | grep -F "obsdog-migrate $RELEASE_VERSION"
          bash scripts/test-native-candidate.sh "$GITHUB_WORKSPACE/candidate/obsdog" "$RELEASE_VERSION"
          if python3 - "$RELEASE_VERSION" <<'PYVERSION'
          import sys
          sys.exit(tuple(map(int,sys.argv[1].removeprefix('v').split('.'))) < (0,2,33))
          PYVERSION
          then
            shared="obsdog-share-migrate_schema12_to13_${RELEASE_VERSION}_darwin_arm64.tar.gz"
            test "$(tar -tzf "candidate/$shared")" = obsdog-share-migrate
            tar -C candidate -xzf "candidate/$shared"
            mkdir prior-schema12
            curl -fsSL --retry 2 https://github.com/obsdoghq/obsdog-releases/releases/download/v0.2.32/obsdog_v0.2.32_darwin_arm64.tar.gz -o prior-schema12/obsdog_v0.2.32_darwin_arm64.tar.gz
            curl -fsSL --retry 2 https://github.com/obsdoghq/obsdog-releases/releases/download/v0.2.32/checksums.txt -o prior-schema12/checksums.txt
            python3 - <<'PYCHECK'
          import hashlib,pathlib
          p=pathlib.Path('prior-schema12/obsdog_v0.2.32_darwin_arm64.tar.gz')
          expected=[line.split()[0] for line in pathlib.Path('prior-schema12/checksums.txt').read_text().splitlines() if line.split()[1].removeprefix('*')==p.name]
          assert len(expected)==1 and hashlib.sha256(p.read_bytes()).hexdigest()==expected[0]
          PYCHECK
            test "$(tar -tzf prior-schema12/obsdog_v0.2.32_darwin_arm64.tar.gz)" = obsdog
            tar -C prior-schema12 -xzf prior-schema12/obsdog_v0.2.32_darwin_arm64.tar.gz
            bash scripts/test-sharing-transition-native.sh "$GITHUB_WORKSPACE/prior-schema12/obsdog" "$GITHUB_WORKSPACE/candidate/obsdog" "$GITHUB_WORKSPACE/candidate/obsdog-share-migrate" "$RELEASE_VERSION" "$RUNNER_TEMP"
          fi
      - name: Verify anonymous published installation and retained-data update
        if: inputs.published
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash scripts/test-published-macos.sh "$RELEASE_VERSION"
