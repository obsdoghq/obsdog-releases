name: Bug report
description: Report a reproducible CLI, plugin or dashboard problem.
body:
  - type: markdown
    attributes:
      value: This issue is PUBLIC. Use invented inputs, not documents, tokens, private URLs, identifiers or Space exports. Do not post security vulnerabilities here.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [CLI, Codex plugin, Claude Code plugin, Local dashboard, Hosted web, Other]
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions and environment
      description: CLI, plugin, AI-client and OS versions; installation route. Omit personal paths and account details.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Commands and tiny invented input; remove any private identifiers.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include a reviewed error message. Describe only the scope actually tested.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this public report and removed private knowledge, credentials and identifying details.
          required: true
